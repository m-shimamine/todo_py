<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>期限のお知らせ｜タスク管理</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="notify-page">

<div class="notify">
  <div class="notify-head">
    <span class="notify-icon" id="notify-icon"></span>
    <span class="notify-title" id="notify-title">期限が来ているタスク</span>
    <button class="notify-close" id="notify-close" title="閉じる"></button>
  </div>
  <div class="notify-list" id="notify-list"></div>
</div>

<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/notify.js"></script>
</body>
</html>
